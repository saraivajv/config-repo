# --- Service Discovery (Eureka) ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka,http://localhost:8762/eureka,http://localhost:8763/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- Server Port ---
server.port=8083

# --- Cache (Redis) ---
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- Banco de Dados Reativo (R2DBC) ---
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/db_service
spring.r2dbc.username=postgres
spring.r2dbc.password=password

# --- Rastreamento (Zipkin) ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# --- Logging ---
logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG

#---
# COREOGRAFIA
spring.config.activate.on-profile=choreography
spring.cloud.function.definition=persistEmployee
spring.cloud.stream.bindings.persistEmployee-in-0.destination=employee-results
spring.cloud.stream.bindings.persistEmployee-in-0.group=db-service-group
spring.cloud.stream.bindings.persistEmployee-out-0.destination=employee-lifecycle

#---
# ORQUESTRAÇÃO
spring.config.activate.on-profile=orchestration
spring.cloud.function.definition=handleSaveCommand
spring.cloud.stream.bindings.handleSaveCommand-in-0.destination=saga-commands
spring.cloud.stream.bindings.handleSaveCommand-in-0.group=db-service-group
spring.cloud.stream.bindings.handleSaveCommand-out-0.destination=saga-replies

#---
# PROFILE: RABBIT (Define RabbitMQ como o broker ativo)
spring.config.activate.on-profile=rabbit
spring.cloud.stream.default-binder=rabbit
spring.cloud.stream.bindings.persistEmployee-in-0.binder=rabbit
spring.cloud.stream.bindings.persistEmployee-out-0.binder=rabbit
spring.cloud.stream.bindings.handleSaveCommand-in-0.binder=rabbit
spring.cloud.stream.bindings.handleSaveCommand-out-0.binder=rabbit
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

#---
# PROFILE: KAFKA (Define Kafka como o broker ativo)
spring.config.activate.on-profile=kafka
spring.cloud.stream.default-binder=kafka
spring.cloud.stream.bindings.validateSalary-in-0.binder=kafka
spring.cloud.stream.bindings.validateSalary-out-0.binder=kafka
spring.cloud.stream.bindings.processSalaryCommand-in-0.binder=kafka
spring.cloud.stream.bindings.processSalaryCommand-out-0.binder=kafka
spring.cloud.stream.kafka.binder.brokers=localhost:9092

spring.cloud.stream.default.content-type=application/json
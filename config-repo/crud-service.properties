eureka.client.service-url.defaultZone=http://localhost:8761/eureka,http://localhost:8762/eureka,http://localhost:8763/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

server.port=8081

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG

spring.cloud.stream.default.content-type=application/json

resilience4j.circuitbreaker.instances.dbServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.dbServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.dbServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.dbServiceCircuitBreaker.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.dbServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.aiServiceCircuitBreaker.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.aiServiceCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.aiServiceCircuitBreaker.wait-duration-in-open-state=30s

resilience4j.retry.instances.dbServiceRetry.max-attempts=3
resilience4j.retry.instances.dbServiceRetry.wait-duration=1s

resilience4j.retry.instances.aiServiceRetry.max-attempts=2
resilience4j.retry.instances.aiServiceRetry.wait-duration=2s

#---
# COREOGRAFIA
spring.config.activate.on-profile=choreography
spring.cloud.function.definition=employeeProducer;employeeResultConsumer

# PRODUTOR: Envia para employee-events
spring.cloud.stream.bindings.employeeProducer-out-0.destination=employee-events

# CONSUMIDOR: Escuta employee-results (Onde Payroll e DB publicam)
spring.cloud.stream.bindings.employeeResultConsumer-in-0.destination=employee-results
spring.cloud.stream.bindings.employeeResultConsumer-in-0.group=crud-group

#---
# ORQUESTRAcaO
spring.config.activate.on-profile=orchestration
spring.cloud.function.definition=sagaCommandProducer;sagaReplyConsumer
spring.cloud.stream.bindings.sagaCommandProducer-out-0.destination=saga-commands
spring.cloud.stream.bindings.sagaReplyConsumer-in-0.destination=saga-replies
spring.cloud.stream.bindings.sagaReplyConsumer-in-0.group=crud-orchestrator

#---
# PROFILE: RABBIT (Define RabbitMQ como o broker ativo)
spring.config.activate.on-profile=rabbit
spring.cloud.stream.default-binder=rabbit
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# CRUD quer ouvir TUDO
# Assim ele pega "salary.rejected", "salary.validated" e "employee.approved"
spring.cloud.stream.rabbit.bindings.employeeResultConsumer-in-0.consumer.exchangeType=topic
spring.cloud.stream.rabbit.bindings.employeeResultConsumer-in-0.consumer.bindingRoutingKey=#

#---
# PROFILE: KAFKA (Define Kafka como o broker ativo)
spring.config.activate.on-profile=kafka
spring.cloud.stream.default-binder=kafka
spring.cloud.stream.kafka.binder.brokers=localhost:9092